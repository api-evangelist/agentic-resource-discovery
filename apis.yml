description: >-
  Agentic Resource Discovery (ARD) is a proposed open standard for the discovery layer that sits in
  front of every agentic protocol — the step before invocation, where a client asks "what is
  available for this task?" and gets back a ranked set of MCP servers, agent cards, skills,
  workflows and APIs it could use. Publishers describe their resources once in an AI Catalog
  manifest at /.well-known/ai-catalog.json on their own domain, anchored by a urn:air: URN derived
  from that domain; independent discovery services crawl those manifests and expose them through a
  small REST interface whose only mandatory endpoint is POST /search. It deliberately does not
  execute anything — MCP, A2A and OpenAPI keep that job — and it deliberately does not try to be
  the one registry, inverting the submit-to-a-registry model in favour of publish-to-your-own-domain.
  Published as a v0.9 draft proposal on 28 May 2026 under Apache 2.0 by three authors at Microsoft,
  Google and Hugging Face, with a contributors wall of eleven organizations. It has no foundation,
  no charter, no participant roster and no working groups; it does have nine public architecture
  decision records and an official conformance CLI. This repo profiles it as a coalition with
  artifacts, and measures the distance between the specification and the endpoint.
