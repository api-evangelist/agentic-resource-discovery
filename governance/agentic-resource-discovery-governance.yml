type: Governance
note: ARD has no foundation, no charter, no CLA, no named governance body and no participant roster. What
  it has instead is a CODEOWNERS file naming three individuals who can approve a normative change, a two-track
  contribution rule, and a public ADR ledger. That is a real and reviewable governance model — it is just
  an unusually small one for a specification carrying eleven corporate logos.
